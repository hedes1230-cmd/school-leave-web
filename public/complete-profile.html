        </aside>
    <div class="auth-card">
        <h1>ตั้งค่าบัญชีของคุณ</h1>
        
        <p id="profileLoading" role="status">กำลังตรวจสอบบัญชี…</p>
        <div id="profileMessage" class="notice notice-err" role="alert" hidden></div>
        <form id="profileForm" novalidate hidden>
          <p class="notice notice-ok"><span id="profileEmailStatus">ยืนยันอีเมลแล้ว</span><br><strong id="profileEmail"></strong></p>
          <div class="field"><label for="fullname">ชื่อ–นามสกุล</label><input id="fullname" autocomplete="name" maxlength="120" required></div>
          <p id="roleLabel" class="label">สถานะผู้ใช้งาน</p>
          <div class="role-pick" role="radiogroup" aria-labelledby="roleLabel" aria-describedby="roleHint">
            <input type="radio" name="role" value="student" id="roleStudent"><label for="roleStudent"><i class="fas fa-user-graduate" aria-hidden="true"></i> นักเรียน</label>
            <input type="radio" name="role" value="teacher" id="roleTeacher"><label for="roleTeacher"><i class="fas fa-chalkboard-user" aria-hidden="true"></i> ครู</label>
          </div>
          <p class="hint" id="roleHint">เลือกได้ครั้งเดียว</p>
          <button class="btn btn-primary btn-block" id="profileSave" type="submit">เริ่มใช้งาน</button>
        </form>
        <button class="btn btn-ghost btn-block" type="button" id="profileCancel" style="margin-top:12px">ใช้บัญชีอื่น / กลับหน้าเข้าสู่ระบบ</button>
<p style="text-align:center;padding:16px;font-size:13px"><a href="privacy.html">ความเป็นส่วนตัว</a></p>
    </div>
